id: patrol_grid_visit
requirements:
- name: ecoscope-platform
  version: 2.18.0
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: 0.1.0rc14.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: 0.0.0rc1.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-mnc
  version: ==1.0.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-wwf-virunga
  version: 0.0.0rc9.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  
- name: ecoscope-workflows-ext-big-life
  version: 1.0.2.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: 0.9.2
  channel: conda-forge

- name: opentelemetry-sdk
  version: '>=1.20.0,<2.0.0'
  channel: conda-forge

- name: ecoscope-workflows-ext-mep
  version: ==1.0.4
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Time Range
  id: time_range
  task: set_time_range

- name: Set Groupers
  id: groupers
  task: set_groupers
  partial:
    groupers: []

- name: Set EarthRanger Connection
  id: er_connection
  task: set_er_connection

- name: Get Patrol Observations
  id: patrol_observations
  task: get_patrol_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    status:
    - done
    include_patrol_details: true
    raise_on_empty: true
    sub_page_size: 200
    patrols_overlap_daterange: true

- name: Set Base Maps Pydeck
  id: base_maps_pydeck
  task: set_base_maps_pydeck

- name: Process Relocations
  id: relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.patrol_observations.return }}
    relocs_columns:
    - groupby_col
    - fixtime
    - junk_status
    - geometry
    - extra__created_at
    - patrol_id
    filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

# - name: Trajectory Segment Filter
#   id: segment_filter
#   task: trajectory_segment_filter

- name: Relocations To Trajectory
  id: to_trajectory
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.relocations.return }}
    # trajectory_segment_filter: ${{ workflow.segment_filter.return }}

- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.to_trajectory.return }}
    drop_columns: []
    retain_columns: []
    raise_if_not_found: false 
    rename_columns:
      extra__patrol_id: patrol_id

- name: Create Patrol Coverage Grid
  id: patrol_coverage_grid
  task: create_patrol_coverage_grid
  partial:
    trajs: ${{ workflow.columns.return }}
    keep_empty_cells: false
    aoi: null

- name: Apply Classification
  id: classification
  task: apply_classification
  partial:
    df: ${{ workflow.patrol_coverage_grid.return }}
    input_column_name: unique_patrol_count
    output_column_name: patrol_count_bins
    label_options:
      label_prefix: ""
      label_suffix: ""
      label_ranges: true
      label_decimals: 0
    classification_options:
      k: 5
      scheme: "equal_interval"

- name: Apply Color Map
  id: color_map
  task: apply_color_map
  partial:
    df: ${{ workflow.classification.return }}
    input_column_name: patrol_count_bins
    colormap: RdYlGn
    output_column_name: bin_colors

- name: Create Geojson Layer
  id: geojson_layer
  task: ecoscope_workflows_ext_custom.tasks.results.create_geojson_layer
  partial:
    geodataframe: ${{ workflow.color_map.return }}
    data_url: null
    layer_style:
      auto_highlight: false
      opacity: 0.65
      pickable: true
      filled: true
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: bin_colors
      get_line_color: [0, 0, 0]
      get_line_width: 0.75
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      values: []
      title: Grid visits
      label_column: patrol_count_bins
      color_column: bin_colors
      sort: null
      label_suffix: null

- name: Compute View State From Gdf
  id: view_state_from_gdf
  task: compute_view_state_from_gdf
  partial:
    gdf: ${{ workflow.color_map.return }}
    pitch: 0
    bearing: 0
    max_zoom: 18


- name: Draw Map
  id: patrol_map
  task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
  partial:
    geo_layers: ${{ workflow.geojson_layer.return }}
    view_state: ${{ workflow.view_state_from_gdf.return }}
    tile_layers: ${{ workflow.base_maps_pydeck.return }}
    static: false
    title: ''
    legend_style:
      placement: bottom-right
    max_zoom: 20

- name: Persist Text
  id: patrol_text
  task: persist_text
  partial:
    text: ${{ workflow.patrol_map.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: patrol_grid_visits.html
    filename_suffix: null

- name: Create Map Widget Single View
  id: map_widget_single_view
  task: create_map_widget_single_view
  partial:
    data: ${{ workflow.patrol_text.return }}
    title: Patrol Grid Visits

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets:
    - ${{ workflow.map_widget_single_view.return }}
    time_range: ${{ workflow.time_range.return }}
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}